plugins {
    id 'com.android.application'
}

android {
    namespace 'app.mojiscope'
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def versionPrefix = "2.0"
    defaultConfig {
        applicationId "app.mojiscope"
        minSdk 26
        targetSdk 36
        versionCode 79
        versionName "$versionPrefix.$versionCode"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            // Personal, sideloaded app: the debug key signs release builds too, so they install (and update over debug builds)
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/CONTRIBUTORS.md', 'META-INF/LICENSE.md']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // GenerateDictionary parses the whole of JMdict and needs about 3 GB, so it only runs on request
        // (./gradlew testDebugUnitTest -PgenerateDictionary --tests app.mojiscope.GenerateDictionary)
        unitTests.all {
            if (project.hasProperty('generateDictionary')) {
                maxHeapSize = '3g'
            } else {
                maxHeapSize = '512m'
                exclude '**/GenerateDictionary*'
            }
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.guava:guava:33.4.0-android'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.j256.ormlite:ormlite-android:6.1'
    implementation 'com.atilika.kuromoji:kuromoji-core:0.9.0'
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.j256.ormlite:ormlite-core:6.1'
    testImplementation 'com.j256.ormlite:ormlite-jdbc:6.1'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'kxml2:kxml2:2.3.0'
}
