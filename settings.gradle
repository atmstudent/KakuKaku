pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Tesseract4Android is only published here
        maven {
            url = uri("https://jitpack.io")
            content { includeGroupByRegex("cz\\.adaptech.*") }
        }
    }
}
rootProject.name = 'KakuKaku'
include ':app'
